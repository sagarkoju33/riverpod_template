name: auth_app
description: "A new Flutter project."

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3
  internet_connection_checker_plus: ^3.1.0

  go_router:

  dio:

  fpdart:

  shared_preferences:
  freezed: ^3.2.5
  freezed_annotation: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_gen_runner: ^5.14.1
  build_runner: ^2.15.0
  riverpod_generator: ^4.0.4
  json_serializable: ^6.14.0

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/fonts/
    - assets/images/
    - assets/icons/

flutter_gen:
  output: lib/src/resources/

# dart run build_runner build
